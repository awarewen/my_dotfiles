# MONITOR CONFIG
# monitor=,preferred,auto,1,transform, 0
# monitor=,addreserved, 0, 0, 0, 0 # Custom reserved area

# HDMI port: mirror display. To see device name, use `hyprctl monitors`
# monitor=HDMI-A-1,1920x1080@60,1920x0,1,mirror,eDP-1
#
monitorv2 { # monitor 拓展屏
# monitor = HDMI-A-1, 3840x2160@59.997002, 1920x0, 2, transform, 0 #,  bitdepth, 10 # bitdepth, 10
    output = HDMI-A-1
    mode = 3840x2160@59.997002
    position = 1920x0
    scale = 2
    transform = 0
    cm = hdr
    bitdepth = 10
    sdrbrightness = 1.0
    sdrsaturation = 1.0
  }

monitorv2 { # 笔记本内屏
# monitor = DSI-1,    1200x1920@60.000000, 0x0,    1, transform, 3, , cm, hddr, bitdepth, 10
    output = DSI-1
    mode = 1200x1920@60.000000
    position = 0x0
    scale = 1
    transform = 3
    cm = hdr
    bitdepth = 10
    sdrbrightness = 1.0
    sdrsaturation = 1.0
  }
monitor =      ,    preferred,           auto,   1                                # 用于快速识别其他便携显示器
monitor = DSI-1,    addreserved,         0,10,10,10                               # 添加屏幕保留区域(不被平铺窗口占用)

gestures {
    workspace_swipe                     = false   # 启用工作区滑动手势
    workspace_swipe_fingers             = 2       # 滑动工作区需要手指的数量
    workspace_swipe_min_fingers         = true    # 如果启用，workspace_swipe_fingers 被认为是要滑动的最小手指的数量
    workspace_swipe_distance            = 300     # 手势距离 (px)
    workspace_swipe_touch               = false   # 启用工作区从touchscreen边缘滑动
    workspace_swipe_invert              = true    # 工作区滑动反转方向
    workspace_swipe_min_speed_to_force  = 5       # 每个时间点以 px 为单位的最小速度，以强制忽略 cancel_ratio 更改。设置为 将 0 禁用此机制。
    workspace_swipe_cancel_ratio        = 0.2     # 手势触发距离 (0.0 - 1.0) 滑动距离 > 0.5 * 手势距离 = 触发手势
    workspace_swipe_create_new          = true    # 在最后一个工作区向右滑动是否创建新工作区
    workspace_swipe_direction_lock      = true    # 如果启用，当滑过 direction_lock_threshold 切换方向将被锁定
    workspace_swipe_direction_lock_threshold = 10 # 方向锁定触发的距离 (px) ?
    workspace_swipe_forever             = false   # 滑动不会回退到相邻工作区，而是到下一个工作区 ?
    workspace_swipe_use_r               = false   # ## 如果启用，轻扫将使用前缀 r 而不是 m 前缀来查找工作区。（需要禁用 workspace_swipe_numbered)

}

general {
    # Gaps and border
    gaps_in = 4
    gaps_out = 5
    gaps_workspaces = 50
    
    border_size = 1
    col.active_border = rgba(0DB7D4FF)
    col.inactive_border = rgba(31313600)
    resize_on_border = true

    no_focus_fallback = true
    
    allow_tearing = true # This just allows the `immediate` window rule to work
    
    snap {
    	enabled = true
    }
}

dwindle {
    preserve_split = true
    smart_split = false
    smart_resizing = false
    # precise_mouse_move = true
}

decoration {
    rounding = 18
    
    blur {
        enabled = true
        xray = true
        special = false
        new_optimizations = true
        size = 14
        passes = 3
        brightness = 1
        noise = 0.01
        contrast = 1
        popups = true
        popups_ignorealpha = 0.6
        input_methods = true
        input_methods_ignorealpha = 0.8
    }
    
    shadow {
        enabled = true
        ignore_window = true
        range = 30
        offset = 0 2
        render_power = 4
        color = rgba(00000010)
    }
    
    # Dim
    dim_inactive = true
    dim_strength = 0.025
    dim_special = 0.07
}

animations {
    enabled = true
    # Curves
    bezier = expressiveFastSpatial, 0.42, 1.67, 0.21, 0.90
    bezier = expressiveSlowSpatial, 0.39, 1.29, 0.35, 0.98
    bezier = expressiveDefaultSpatial, 0.38, 1.21, 0.22, 1.00
    bezier = emphasizedDecel, 0.05, 0.7, 0.1, 1
    bezier = emphasizedAccel, 0.3, 0, 0.8, 0.15
    bezier = standardDecel, 0, 0, 0, 1
    bezier = menu_decel, 0.1, 1, 0, 1
    bezier = menu_accel, 0.52, 0.03, 0.72, 0.08
    # Configs
    # windows
    animation = windowsIn, 1, 3, emphasizedDecel, popin 80%
    animation = windowsOut, 1, 2, emphasizedDecel, popin 90%
    animation = windowsMove, 1, 3, emphasizedDecel, slide
    animation = border, 1, 10, emphasizedDecel
    # layers
    animation = layersIn, 1, 2.7, emphasizedDecel, popin 93%
    animation = layersOut, 1, 2.4, menu_accel, popin 94%
    # fade
    animation = fadeLayersIn, 1, 0.5, menu_decel
    animation = fadeLayersOut, 1, 2.7, menu_accel
    # workspaces
    animation = workspaces, 1, 7, menu_decel, slide
    ## specialWorkspace
    animation = specialWorkspaceIn, 1, 2.8, emphasizedDecel, slidevert
    animation = specialWorkspaceOut, 1, 1.2, emphasizedAccel, slidevert
}

input {
    kb_layout = us
    numlock_by_default = true
    repeat_delay = 250
    repeat_rate = 35
    
    follow_mouse = 1

    touchpad {
        natural_scroll = yes
        disable_while_typing = true
        clickfinger_behavior = true
        scroll_factor = 0.5
    }
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    vfr = 1
    vrr = 1
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
    animate_manual_resizes = false
    animate_mouse_windowdragging = false
    enable_swallow = false
    swallow_regex = (foot|kitty|allacritty|Alacritty)
    new_window_takes_over_fullscreen = 2
    allow_session_lock_restore = true
    initial_workspace_tracking = false
    focus_on_activate = true
}

binds {
    scroll_event_delay = 0
    hide_special_on_workspace_change = true
}

cursor {
    zoom_factor = 1
    zoom_rigid = false
}

# Overview
plugin {
    hyprexpo {
        columns = 3
        gap_size = 5
        bg_col = rgb(000000)
        workspace_method = first 1 # [center/first] [workspace] e.g. first 1 or center m+1

        enable_gesture = false # laptop touchpad, 4 fingers
        gesture_distance = 300 # how far is the "max"
        gesture_positive = false
    }
}
