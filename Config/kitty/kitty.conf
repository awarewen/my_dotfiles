# Font
font_family      JetBrains Mono Nerd Font
font_size 11.0

# Cursor
cursor_shape beam
cursor_trail 1

# Padding (why weird value? consistency with foot)
window_margin_width 21.75

# No stupid close confirmation
confirm_os_window_close 0

# Use fish shell
# shell fish
shell /bin/zsh

# Copy
map ctrl+c    copy_or_interrupt

# Search
map ctrl+f   launch --location=hsplit --allow-remote-control kitty +kitten search.py @active-kitty-window-id
map kitty_mod+f   launch --location=hsplit --allow-remote-control kitty +kitten search.py @active-kitty-window-id

# Scroll & Zoom
map page_up    scroll_page_up
map page_down    scroll_page_down

map ctrl+plus  change_font_size all +1
map ctrl+equal  change_font_size all +1
map ctrl+kp_add  change_font_size all +1
map ctrl+minus       change_font_size all -1
map ctrl+underscore       change_font_size all -1
map ctrl+kp_subtract       change_font_size all -1
map ctrl+0 change_font_size all 0
map ctrl+kp_0 change_font_size all 0


# MySetup
# ------
# Theme
#
cursor #FF3061
cursor_text_color #F416FF
cursor_beam_thickness 3
cursor_blink_interval 0.2
cursor_stop_blinking_after 0

# tab 样式
tab_bar_align        center
tab_bar_style        separator
tab_bar_min_tabs     1
tab_bar_edge         bottom
tab_separator        " | "
tab_powerline_style  slanted
tab_title_template   {title}{' :{}:'.format(num_windows) if num_windows > 1 else ''}

active_tab_foreground   #000
active_tab_background   #FF3061
inactive_tab_foreground #444
inactive_tab_background #999

# kitty 窗口整体的前景背景颜色
background #272a34
foreground #ffffff

# Url
url_color #FF3061
url_style curly
url_prefixes file ftp ftps gemini git gopher http https irc ircs kitty mailto news sftp ssh

clipboard_max_size 512
clipboard_control write-clipboard write-primary read-clipboard-ask read-primary-ask
map kitty_mod+c copy_to_clipboard

# 是否记忆窗口大小
remember_window_size no
remember_window_position no
