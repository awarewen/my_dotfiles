# =======================================================================================================================
# Cursor 输入法环境变量配置 - 解决 Cursor 等 Electron 应用在 Wayland 下的输入法问题
# =======================================================================================================================

# 基础输入法环境变量
env = GTK_IM_MODULE, fcitx
env = QT_IM_MODULE, fcitx
env = XMODIFIERS, @im=fcitx
env = SDL_IM_MODULE, fcitx
env = GLFW_IM_MODULE, ibus
env = INPUT_METHOD, fcitx

# Electron 应用在 Wayland 下的输入法兼容性修复
env = ELECTRON_OZONE_PLATFORM_HINT, auto
env = ELECTRON_ENABLE_LOGGING, 1
env = ELECTRON_ENABLE_STACK_DUMPING, 1

# 针对 Cursor/VSCode 等 Electron 应用的额外修复
env = VSCODE_IPC_HOOK_CLI, 1
env = VSCODE_CRASH_REPORTER_DIR, /tmp/vscode-crash-reporter

# Wayland 输入法协议相关
env = GTK_USE_PORTAL, 1
env = QT_WAYLAND_DISABLE_WINDOWDECORATION, 1

# 确保 Electron 应用使用正确的 Wayland 后端
env = OZONE_PLATFORM, wayland
env = OZONE_PLATFORM_HINT, auto

# 输入法调试（可选，如果问题解决后可以注释掉）
# env = FCITX_DEBUG, 1
# env = GTK_DEBUG, immodules

# ======================================================================================================================= 