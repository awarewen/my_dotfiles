# See https://wiki.hyprland.org/Configuring/Binds/
# Add stuff here
# Use #! to add an extra column on the cheatsheet
# Use ##! to add a section in that column
# Add a comment after a bind to add a description, like above

#!
##! MOD KEY
# ======================================================================#
$MAIN_MOD  = SUPER
$MAIN_L    = SUPER_L # 当希望将modkey作为触发键请在对应mod后加 '_L'
$ALT_MOD   = ALT
$CTRL_MOD  = CTRL
$SHIFT_MOD = SHIFT

$MAIN_CTRL_MOD  = $MAIN_MOD $CTRL_MOD   # SUPER+CTRL
$MAIN_ALT_MOD   = $MAIN_MOD $ALT_MOD    # SUPER+ALT
$MAIN_SHIFT_MOD = $MAIN_MOD $SHIFT_MOD  # SUPER+SHIFT
# ======================================================================#

# ======================================================================#
# hyprctl OPTs
$DISP = hyprctl dispatch
$SETP = hyprctl setprop
$KEYWD = hyprctl keyword

# 用于退出 submap 状态
$RESET_MAP = hyprctl dispatch submap reset
# ======================================================================#

#!
##! Global Bar keybinds
bind = $MAIN_MOD, $MAIN_L, submap, global # [hidden]
submap=global # [hidden]
bind = , escape, submap, reset                                          # <ESC> : 推出 submap
submap = reset

#!
##! User
bind = Ctrl+Super, Slash, exec, xdg-open ~/.config/illogical-impulse/config.json # Edit shell config [Notwork]
bind = Ctrl+Super+Alt, Slash, exec, xdg-open ~/.config/hypr/custom/keybinds.conf # Edit extra keybinds [Notwork]



# 常用的快捷键
# ======================================================================#
bind = $MAIN_MOD, Q, execr, $DISP killactive                            # [hidden] <MAIN_MOD Q> # 关闭活动窗口 不杀死相关进程
# 移动工作区焦点
bind = $MAIN_MOD, 1, workspace,  1                                      # [hidden]
bind = $MAIN_MOD, 2, workspace,  2                                      # [hidden]
bind = $MAIN_MOD, 3, workspace,  3                                      # [hidden]
bind = $MAIN_MOD, 4, workspace,  4                                      # [hidden]
bind = $MAIN_MOD, 5, workspace,  5                                      # [hidden]
bind = $MAIN_MOD, 6, workspace,  6                                      # [hidden]
bind = $MAIN_MOD, 7, workspace,  7                                      # [hidden]
bind = $MAIN_MOD, 8, workspace,  8                                      # [hidden]
# ======================================================================#

# ======================================================================#
# Windowactions
bind = $MAIN_MOD, W, submap, WindowAction                               # [hidden] <MAIN_MOD W ( )>
submap=WindowAction
# ======================================================================#
  bind =          , C, execr, $DISP forcekillactive     && $RESET_MAP   # [hidden] <Q> : kills 活动窗口及相关进程
  bind =          , T, execr, $DISP togglefloating      && $RESET_MAP   # [hidden] <T> : 窗口浮动切换
  bind =          , P, execr, $DISP pseudo              && $RESET_MAP   # [hidden] <P> : 窗口伪平铺切换
  bind =          , F, execr, $DISP fullscreen 1        && $RESET_MAP   # [hidden] <F> : 全屏窗口切换（保留间隙）
  bind = $MAIN_MOD, F, execr, $DISP fullscreen 0        && $RESET_MAP   # [hidden] <F> : 全屏窗口切换（不保留间隙）
  bind =          , G, execr, $DISP fullscreenstate      && $RESET_MAP  # [hidden] <G> : 伪全屏窗口切换
  #bind =          , G, execr, $DISP orientationleft     && $RESET_MAP   # <G> : 伪全屏窗口切换
  bind = $MAIN_MOD, P, execr, $DISP pin active          && $RESET_MAP   # [hidden] <MAIN_P> : pin active window| 仅支持浮动窗口
  bind =          , O, execr, $DISP setprop active opaque toggle && $RESET_MAP  # [hidden] <O> : 透明切换
  bind =          , L, execr, $SCREEN_LOCK              && $RESET_MAP   # [hidden] <L> : 锁屏
  bind =          , E, execr, $MANUAL_SWITCH_WALLPAPER  && $RESET_MAP   # [hidden] <E> : 切换壁纸
  bind =          , R, execr, $KEYWD monitor DSI-1,transform, 1  && $RESET_MAP  # [hidden] <R> : 旋转屏幕
  bind =          , Y, execr, $KEYWD monitor DSI-1,transform, 3 && $RESET_MAP   # [hidden] <Y> : 旋转屏幕
  bind =          , I, execr, $LOCAL_BIN_DIR/guifetch   && $RESET_MAP   # [hidden] <I> : guifetch
  bind = $MAIN_MOD, R, execr, $DISP exit                && $RESET_MAP   # [hidden] <R> : Hyprland 重启
  bind = $MAIN_MOD, Q, execr, $WLOGOUT                  && $RESET_MAP   # [hidden] <MAIN_Q> : wlogout

# 将窗口移动到指定工作区
  bind =          , 1, execr, $DISP movetoworkspace 1   && $RESET_MAP   # [hidden] <1>
  bind =          , 2, execr, $DISP movetoworkspace 2   && $RESET_MAP   # [hidden] <2>
  bind =          , 3, execr, $DISP movetoworkspace 3   && $RESET_MAP   # [hidden] <3>
  bind =          , 4, execr, $DISP movetoworkspace 4   && $RESET_MAP   # [hidden] <4>
  bind =          , 5, execr, $DISP movetoworkspace 5   && $RESET_MAP   # [hidden] <5>
  bind =          , 6, execr, $DISP movetoworkspace 6   && $RESET_MAP   # [hidden] <6>
  bind =          , 7, execr, $DISP movetoworkspace 7   && $RESET_MAP   # [hidden] <7>
  bind =          , 8, execr, $DISP movetoworkspace 8   && $RESET_MAP   # [hidden] <8>
# 更改当前屏幕存在的工作区的焦点
  bind = , J, workspace, m+1                                            # [hidden] <J> : 下一个工作区
  bind = , K, workspace, m-1                                            # [hidden] <K> : 上一个工作区
bind = , escape,  submap, reset                                         # [hidden] <ESC>
# ======================================================================# 进入二级 submap SwapWindow
bind = , S, submap, SwapWindow                                          # [hidden] <MAIN_MOD M S ( )>
submap=SwapWindow
    bind = , H, movewindow, l                                           # [hidden] <H>: Left
    bind = , L, movewindow, r                                           # [hidden] <L>: Right
    bind = , K, movewindow, u                                           # [hidden] <K>: Up
    bind = , J, movewindow, d                                           # [hidden] <J>: Down
    bind = , N, swapnext,   next                                        # [hidden] <N>: Next
    bind = , P, swapnext,   prev                                        # [hidden] <P>: Prev
# ======================================================================#
# Quit : 退出二级 submap
  bind = , BackSpace, submap, WindowAction                              # [hidden] <BackSpace> : 返回上级 windowaction submap
  bind = , S,         submap, reset                                     # [hidden] <S> : 退出 submap
# Quit submap                                                             
bind = , escape, submap, reset                                          # [hidden] <ESC> : 推出 submap
submap=reset
# ======================================================================#



# ======================================================================#
# 窗口组管理 : 进入一级 submap
bind = $MAIN_MOD,  G, submap, WindowsGroup                              # [hidden] <MAIN_MOD G ( )>
submap=WindowsGroup
  bind = , F,   togglegroup                                             # [hidden] <F>:    抓取/释放
# 组窗口切换
  bind = , tab, changegroupactive, f                                    # [hidden] <TAB>:  下一个
  bind = $SHIFT_MOD, tab, changegroupactive, b                          # [hidden] <TAB>:  上一个
  bind = , 1, changegroupactive, 1                                      # [hidden] <1>: 开始
  bind = , 2, changegroupactive, 2                                      # [hidden] <2>
  bind = , 3, changegroupactive, 3                                      # [hidden] <3>
  bind = , 4, changegroupactive, 4                                      # [hidden] <4>
  bind = , 5, changegroupactive, 5                                      # [hidden] <5>
  bind = , 6, changegroupactive, 6                                      # [hidden] <6>
  bind = , 7, changegroupactive, 7                                      # [hidden] <7>
  bind = , 8, changegroupactive, 8                                      # [hidden] <8>
  bind = , 9, changegroupactive, 9                                      # [hidden] <9>
  bind = , 0, changegroupactive, 0                                      # [hidden] <0>: 结尾
# 两次floating 直接合并入组（按 T 切换浮动后组内可移动）
  bind = , T,   togglefloating,                                         # [hidden] <T>:    切换浮动
  bind = , O,   execr, $DISP lockactivegroup lock                       # [hidden] <O>:  组锁定
  bind = , U,   execr, $DISP lockactivegroup unlock                     # [hidden] <U>:  组解锁
  bind = , I,   execr, $DISP lockactivegroup toggle                     # [hidden] <I>:  切换锁定 (感知组锁定)
# 将移动焦点添加到这个submap方便切换窗口 MOVE focus
  bind = , H,   movefocus, l                                            # [hidden] <H>: Left
  bind = , L,   movefocus, r                                            # [hidden] <L>: Right
  bind = , K,   movefocus, u                                            # [hidden] <K>: Up
  bind = , J,   movefocus, d                                            # [hidden] <J>: Down
  bind = , P,   cyclenext, prev                                         # [hidden] <P>: Prev
  bind = , N,   cyclenext,                                              # [hidden] <N>: Next
# 退出一级 submap
bind = , G,     submap, reset                                           # [hidden] <G>
bind = , escape,submap, reset                                           # [hidden] <ESC>
submap=reset
# ======================================================================#

# ======================================================================#
# 更改窗口焦点
bind = $MAIN_MOD, H, movefocus, l                                       # [hidden] <H>
bind = $MAIN_MOD, L, movefocus, r                                       # [hidden] <L>
bind = $MAIN_MOD, K, movefocus, u                                       # [hidden] <K>
bind = $MAIN_MOD, J, movefocus, d                                       # [hidden] <J>
bind = $MAIN_MOD, P, cyclenext, prev                                    # [hidden] <P>: Prev
bind = $MAIN_MOD, N, cyclenext,                                         # [hidden] <N>: Next
# ======================================================================#

# ======================================================================#
# mouseEmpty Mapping
bindm = $MAIN_MOD, mouse:272, movewindow
bindm = $MAIN_MOD, mouse:273, resizewindow
# ======================================================================#

# ======================================================================#
# Scratchpad
bind = $MAIN_ALT_MOD, grave, movetoworkspace,  special                  # [hidden] <SUPER+ALT+`> : 将当前窗口发送到特殊工作区
bind = $MAIN_MOD,     grave, togglespecialworkspace,                    # [hidden] <MAIN+`>      : 显示和隐藏特殊工作区
# 将特殊工作区的窗口发送到当前存在的空白工作区并平铺
bind = $MAIN_ALT_MOD, w, movetoworkspace, empty                         # [hidden] <MAIN+ALT+W>  : 将特殊工作区发送到空白的工作区
bind = $MAIN_ALT_MOD, w, togglefloating,  window                        # [hidden] <MAIN+ALT+W>  : 切换平铺
# ======================================================================#

# ======================================================================#
# Resize window 调整当前窗口大小
# 平铺时的单窗口无作用！
# 浮动窗口仅以左上角为基点调整
# $DISP maen dispatch  edu
bind = $MAIN_MOD, R, submap, resize                                     # [hidden] <MAIN+R ( )> : 调整窗口大小
submap=resize
  binde = ,           H, execr, $DISP resizeactive, 20 0 && $DISP moveactive -20 0  # <H> 左
  binde = $SHIFT_MOD, H, execr, $DISP resizeactive, 20 0 && $DISP moveactive -20 0
  binde = ,           J, resizeactive, 0   20                           # [hidden] <J> 下
  binde = $SHIFT_MOD, J, resizeactive, 0 -20
  binde = ,           K, resizeactive, 0  -20                           # [hidden] <K> 上
  binde = $SHIFT_MOD, K, resizeactive, 0 20
  binde = ,           L, resizeactive, 20  0                            # [hidden] <L> 右
  binde = $SHIFT_MOD, L, resizeactive, -20 0
# ======================================================================# 兼容方向键
  binde = , Left,  resizeactive, -10  0                                 # [hidden] <Left>
  binde = , Down,  resizeactive,  0   10                                # [hidden] <Down>
  binde = , Up,    resizeactive,  0  -10                                # [hidden] <Up>
  binde = , Right, resizeactive,  10  0                                 # [hidden] <Right>
# Quit : 退出一级 submap
bind  = , R,      submap, reset                                         # [hidden] <R>
bindt = , escape, submap, reset                                         # [hidden] <ESC>
submap = reset                                                            
