# You can put custom rules here
# Window/layer rules: https://wiki.hyprland.org/Configuring/Window-Rules/
# Workspace rules: https://wiki.hyprland.org/Configuring/Workspace-Rules/
#
# ===================================================================
#                            Float 浮动窗口
# ===================================================================

# kitty
# 让 kitty 中标题为 kitty_float/kitty_alsamixer 的窗口浮动
windowrule = float on, match:class kitty, match:title ^(kitty_float|kitty_alsamixer)$

# QQ 图片/视频/聊天记录窗口浮动
windowrule = float on, match:class QQ, match:title ^(图片查看器|视频|聊天记录)$

# pot 相关（如需启用取消注释）
# windowrule = float on, match:class pot, match:title ^(Recognize|Config|Translator|Translate|OCR|PopClip|Screenshot Translate)$

# 将 firefox 拓展 Aria2 下载窗口浮动并居中显示
exec-once = $HYPR_SCRIPTS_DIR/windowrule.sh
#
# ===================================================================
#                             kitty窗口初始化大小
# ===================================================================
#  如果想要这条配置在hyprland工作，保证kitty config下列配置项注释掉:
#  enabled_layouts
#  initial_window_width
#  initial_window_height
#  remember_window_size
windowrule = size 1300 800, match:class kitty, match:title ^(float_kitty)$
windowrule = size 418 234, match:class kitty, match:title ^(kitty_clock|kitty_cava)$
windowrule = size 185 675, match:class kitty, match:title ^(kitty_alsamixer)$

# ===================================================================
#                             Opacitys 不透明
# ===================================================================
# 媒体/视频类窗口（浏览器）
windowrule = opaque on, match:class (firefox|chromium), match:title ^(bilibili|哔哩哔哩|YouTube|[Vv]ideo|视屏播放|Media viewer|Aria2)$

# 工具类窗口
windowrule = opaque on, match:class kitty, match:title ^(kitty_alsamixer)$

# 特定中文应用
windowrule = opaque on, match:class QQ, match:title ^(图片查看器|视频|聊天记录)$
windowrule = opaque on, match:class telegram

# vimiv
# 忽略边框 layer?
# windowrule = no_border on, match:class fcitx
#
# at: 5,665
# size: 1570,320
# 让 vimiv 窗口浮动并设置初始位置和尺寸
windowrule = opaque on, match:class vimiv
windowrule = float on, match:class vimiv, match:title ^(Choose wallpaper)$
windowrule = move 2% 60%, match:class vimiv, match:title ^(Choose wallpaper)$
windowrule = size 96% 40%, match:class vimiv, match:title ^(Choose wallpaper)$

# satty
windowrule = opaque on, match:class com.gabm.satty
windowrule = float on, match:class com.gabm.satty, match:title ^(satty)$
windowrule = size 1300 800, match:class com.gabm.satty, match:title ^(satty)$ # 百分比对 satty 不起作用
