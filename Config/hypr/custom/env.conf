# You can put extra environment variables here
# https://wiki.hyprland.org/Configuring/Environment-variables/
# Hyprland env
# =======================================================================================================================
env = HYPRLAND_LOG_WLR, 1     # 启用更详细的 wlroot 日志记录。
env = HYPRLAND_NO_RT, 1       # 禁用 hyprland 的实时优先级设置
env = HYPRLAND_NO_SD_NOTIFY,1 # 如果是systemd 则禁用sd_notify
env = HYPRLAND_NO_SD_VARS, 1  # 禁用 systemd 和 dbus 激活环境中的变量管理

# 重要！ hyprland 配置目录设置不正确将影响部分配置正常运行
env = HYPR_CONF_DIR, $HOME/.config/hypr             # hyprland 配置所在目录
env = HYPR_SCRIPTS_DIR, $HOME/.config/hypr/scripts  # 辅助脚本所在目录


# XDG
# =======================================================================================================================
env = XDG_CURRENT_DESKTOP, Hyprland
env = XDG_SESSION_TYPE, wayland
env = XDG_SESSION_DESKTOP, Hyprland

# toolkit-specific QT/GTK
# =======================================================================================================================
env = GDK_BACKEND, wayland, x11, *  # GTK   GTK2不支持wayland
env = CLUTTER_BACKEND, wayland      # clutter 图形库的wayland支持
env = SDL_VIDEODRIVER, wayland      # 影响游戏

# # QT
env = QT_AUTO_SCREEN_SCALE_FACTOR,1           # 根据显示器像素密度自动缩放
env = QT_QPA_PLATDORM, wayland, xcb           # 后端
env = QT_WAYLAND_DISABLE_WINDOWDECORATION, 1  # 禁用 QT 程序的窗口装饰
env = QT_QPA_PLATFORMTHEME, qt5ct             # 基于 Qt 的应用程序从 qt5ct 中选择主题，与 kvantum 一起使用

# # GTK
env = GDK_SCALE, 2  # 此变量不与原生wayland GTK程序冲突
env = GDK_DPI_SCALE, 1.25

# # IME fcitx env
env = QT_IM_MODULE, wayland, fcitx, ibus
#env = GTK_IM_MODULE, fcitx                    # fcitx env
env = XMODIFIERS, @im=fcitx
env = INPUT_METHOD, fcitx
env = SDL_IM_MODULE, fcitx
env = GLFW_IM_MODULE, ibus

# # Theme
env = GTK_THEME, Catppuccin-Macchiato # 手动指定 GTK 主题，不使用 lxappearance 或 nwg-look
# Gnome cursor theme needed paths
env = XCURSOR_PATH, ${XCURSOR_PATH}:~/.local/share/icons
env = XCURSOR_THEME, Bibata-Modern-Ice # cursor themes. `$HOME/.local/share/icons/`
env = XCURSOR_SIZE, 32

# # Java
env = _JAVA_AWT_WM_NONREPARENTING, 1  # 修复 java AWT 应用窗口渲染，可能导致应用崩溃

# For firefox
env = MOZ_ENABLE_WAYLAND, 1     # 对触摸屏支持更好，减少内存占用
env = MOZ_DIABLE_RDD_SANDBOX, 1 # 禁用 RDD 媒体解码器沙箱
# =======================================================================================================================

# # Aquamarine(gem) ruby 包管理器环境变量
#env = AQ_TRACE, 1
#env = AQ_DRM_DEVICES, # 设置要使用的 DRM 设备(GPU) 明确列表
#env = AQ_MGPU_NO_EXPLICIT, 1 # 禁用 mgpu 缓冲区上的显式同步
#env = AQ_NO_MODIFIERS, 1 # 禁用 DRM 缓冲区的修饰符

# # NVIDIA
#env = GBM_BACKEND,nvidia-drm
#env = __GLX_VENDOR_LIBRARY_NAME,nvidia
#env = LIBVA_DRIVER_NAME,nvidia
#
# Hyprland default app init
#
# 此文件将为 keybind 等其他 Config 提供相应的变量配置
# 方便集中管理这些变量
# 2025-06-30
# =======================================================================================================================

$LOCAL_BIN_DIR    = $HOME/.local/bin # 用户 local bin

# # Default Applacations and OPTs
# =======================================================================================================================
# 使用单实例运行kitty 减少资源占用
$TERMINAL_FULLSCREEN = kitty --single-instance --start-as=fullscreen --title fullscreen_kitty  # kitty 全屏
$TERMINAL_FLOAT      = kitty --single-instance --title kitty_float # 浮动窗口
$TERMINAL_TILE       = kitty --single-instance --title kitty_tile  # 平铺窗口

# 输入法
# =======================================================================================================================
$IME = fcitx5 -d --replace

# 文件管理器
# =======================================================================================================================
$FILE_MANAGER = thunar

# APP_LAUNCHER
# =======================================================================================================================
$APP_LAUNCHER = $HOME/.config/rofi/scripts/launcher_t2  # ## rofi launcher and theme(themes: https://github.com/adi1090x/rofi)

# Bar 相关
# =======================================================================================================================
# # Waybar
$WAYBAR_CONF_DIR = $HYPR_CONF_DIR/misc/component/waybar

$WAYBAR_CONF_DIR  = $HYPR_CONF_DIR/misc/component/waybar
$BAR = waybar -c $WAYBAR_CONF_DIR/config.jsonc -s $WAYBAR_CONF_DIR/style.css

# 以下 Bar 配置为弃置状态
# caelestia shell
# ags
# $EWW_CONF_DIR = $HOME/.config/eww
# $EWW_SCRIPTS_DIR = $EWW_CONF_DIR/scripts
# eww -c $EWW_CONF_DIR daemon && eww -c $EWW_CONF_DIR open bar && eww -c $EWW_CONF_DIR open bgdecor

# 剪切板历史
# =======================================================================================================================
$PRIMARY_CLIPBOARD_VIEWER = cliphist list | rofi -dmenu -theme "$HOME/.config/rofi/launchers/type-2/style-1" | cliphist decode | wl-copy

# 音频
# =======================================================================================================================
$VOLUME_CTL = kitty --single-instance --title kitty_alsamixer  --hold alsamixer   # 待替换成更美观的OSD脚本(待处理)

# Keybind 使用的变量
# =======================================================================================================================

# 壁纸
$WALLPAPER_DAEMON = swww-daemon
$WALLPAPER_DIR    = $HOME/Pictures/Wallpapers                         # 壁纸目录 [ 重要：swww 正常工作必要目录 ]
$WALLPAPER_SWITCH_SCRIPT = $HYPR_SCRIPTS_DIR/swww_randomize.sh        # 壁纸脚本切换路径
$MANUAL_SWITCH_WALLPAPER = $WALLPAPER_SWITCH_SCRIPT -m $WALLPAPER_DIR # 手动切换壁纸 [keybind]
#$AOTU_SWITCH_WALLPAPER   = $WALLPAPER_SWITCH_SCRIPT -d $WALLPAPER_DIR # 取消注释 下次即可开机自动切换壁纸 [keybind]


# SCREEN_LOCK / WLOGOUT
$SCREEN_LOCK  = loginctl lock-session # hyprlock + hypridle + dpms 锁屏后无操作后黑屏
$WLOGOUT      = wlogout --protocol layer-shell  # 登出/关机菜单 [keybind: WindowAction 内 Super+Q]
#$SCREEN_LOCK  = $HYPR_SCRIPTS_DIR/misc/swaylock.sh # hyprlock + hypridle-effects + swayidle


# 声音, 亮度, mpris (待处理)

$VOLUME_MUTE = ags -r "audio.speaker.isMuted = !audio.speaker.isMuted"    || $HYPR_SCRIPTS_DIR/volume_brightness.sh volume_mute || pactl set-sink-mute @DEFAULT_SINK@ toggle
$VOLUME_UP   = ags -r 'audio.speaker.volume += 0.1; indicator.speaker()' || $HYPR_SCRIPTS_DIR/volume_brightness.sh volume_up   || wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
$VOLUME_DOWN = ags -r 'audio.speaker.volume -= 0.1; indicator.speaker()' || $HYPR_SCRIPTS_DIR/volume_brightness.sh volume_down || wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-

$BRIGHTNESS_UP   = ags -r 'brightness.screen += 0.5; indicator.display()' || $HYPR_SCRIPTS_DIR/volume_brightness.sh brightness_up   || light -A 2
$BRIGHTNESS_DOWN = ags -r 'brightness.screen -= 0.5; indicator.display()' || $HYPR_SCRIPTS_DIR/volume_brightness.sh brightness_down || light -U 2

$NEXT_TRACK = ags -r 'mpris.next()'      || $HYPR_SCRIPTS_DIR/volume_brightness.sh next_track
$PLAY_PAUSE = ags -r 'mpris.playPause()' || $HYPR_SCRIPTS_DIR/volume_brightness.sh play_pause
$PREV_TRACK = ags -r 'mpris.previous()'  || $HYPR_SCRIPTS_DIR/volume_brightness.sh prev_track

$VOLUME_OSD = $EWW_SCRIPTS_DIR/volume osd &
$BRIGHTNESS_OSD = $EWW_SCRIPTS_DIR/brightness osd &
# =======================================================================================================================

