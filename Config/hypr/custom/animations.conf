# ===================================================================
#                           动画 (优化丝滑度)
# 独立配置文件，便于单独调整动效
# ===================================================================
animations {
    enabled = true
    # 曲线：通用「丝滑」曲线，用于窗口/工作区/图层
    bezier = smoothIn, 0.25, 0.1, 0.25, 1
    bezier = smoothOut, 0.33, 0, 0.2, 1
    bezier = expressiveFastSpatial, 0.42, 1.67, 0.21, 0.90
    bezier = expressiveSlowSpatial, 0.39, 1.29, 0.35, 0.98
    bezier = expressiveDefaultSpatial, 0.38, 1.21, 0.22, 1.00
    bezier = emphasizedDecel, 0.05, 0.7, 0.1, 1
    bezier = emphasizedAccel, 0.3, 0, 0.8, 0.15
    bezier = standardDecel, 0, 0, 0, 1
    bezier = menu_decel, 0.1, 1, 0, 1
    bezier = menu_accel, 0.52, 0.03, 0.72, 0.08
    bezier = stall, 1, -0.1, 0.7, 0.85

    # 窗口
    animation = windowsIn, 1, 4, smoothOut, popin 85%
    animation = fadeIn, 1, 4, smoothOut
    animation = windowsOut, 1, 3, smoothIn, popin 88%
    animation = fadeOut, 1, 3, smoothIn
    animation = windowsMove, 1, 4, smoothOut, slide
    animation = border, 1, 5, smoothOut

    # 图层
    animation = layersIn, 1, 3, smoothOut, popin 93%
    animation = layersOut, 1, 2.5, menu_accel, popin 94%
    animation = fadeLayersIn, 1, 0.5, menu_decel
    animation = fadeLayersOut, 1, 2.5, stall

    # 工作区
    animation = workspaces, 1, 5, smoothOut, slide
    animation = specialWorkspaceIn, 1, 3, smoothOut, slidevert
    animation = specialWorkspaceOut, 1, 2, emphasizedAccel, slidevert

    # 缩放
    animation = zoomFactor, 1, 4, smoothOut
}
