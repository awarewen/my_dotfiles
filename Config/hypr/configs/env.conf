# Hyprland env
# =======================================================================================================================
env = HYPRLAND_LOG_WLR, 1     # 启用更详细的 wlroot 日志记录。
env = HYPRLAND_NO_RT, 1       # 禁用 hyprland 的实时优先级设置
env = HYPRLAND_NO_SD_NOTIFY,1 # 如果是systemd 则禁用sd_notify
env = HYPRLAND_NO_SD_VARS, 1  # 禁用 systemd 和 dbus 激活环境中的变量管理
#env = HYPRLAND_CONFIG,~/.config/hypr # 指定 hyprland 配置位置

env = HYPR_CONF_DIR, $HOME/.config/hypr         # hyprland 配置所在目录
env = HYPR_SCRIPTS_DIR, $HYPR_CONF_DIR/scripts  # 辅助脚本所在目录


# XDG
# =======================================================================================================================
env = XDG_CURRENT_DESKTOP, Hyprland
env = XDG_SESSION_TYPE, wayland
env = XDG_SESSION_DESKTOP, Hyprland

# toolkit-specific QT/GTK
# =======================================================================================================================
env = GDK_BACKEND, wayland, x11, *  # GTK   GTK2不支持wayland
env = QT_QPA_PLATFORM,wayland;xcb   # QT
env = CLUTTER_BACKEND, wayland      # clutter 图形库的wayland支持
env = SDL_VIDEODRIVER, wayland      # 影响游戏

# # QT
env = QT_AUTO_SCREEN_SCALE_FACTOR,1           # 根据显示器像素密度自动缩放
env = QT_QPA_PLATDORM, wayland, xcb           # 后端
env = QT_WAYLAND_DISABLE_WINDOWDECORATION, 1  # 禁用 QT 程序的窗口装饰
env = QT_QPA_PLATFORMTHEME, qt5ct             # 基于 Qt 的应用程序从 qt5ct 中选择主题，与 kvantum 一起使用

# # GTK
env = GDK_SCALE, 2              # 此变量不与原生wayland GTK程序冲突
env = GDK_DPI_SCALE, 1.25

# # Theme
env = GTK_THEME, Catppuccin-Macchiato # 手动指定 GTK 主题，不使用 lxappearance 或 nwg-look
# Gnome cursor theme needed paths
env = XCURSOR_PATH, ${XCURSOR_PATH}:~/.local/share/icons
env = XCURSOR_THEME, Bibata-Modern-Ice # cursor themes. `$HOME/.local/share/icons/`
env = XCURSOR_SIZE, 32

# # Java
env = _JAVA_AWT_WM_NONREPARENTING, 1  # 修复 java AWT 应用窗口渲染，可能导致应用崩溃

# For firefox
env = MOZ_ENABLE_WAYLAND, 1     # 对触摸屏支持更好，减少内存占用
env = MOZ_DIABLE_RDD_SANDBOX, 1 # 禁用 RDD 媒体解码器沙箱
# =======================================================================================================================

