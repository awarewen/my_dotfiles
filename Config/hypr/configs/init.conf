# Hyprland default app init
#
# 此文件将为 keybind 提供相应的变量配置
# 2025-06-30
# =======================================================================================================================

# # Default Applacations and OPTs
# =======================================================================================================================
# 使用单实例运行kitty 减少资源占用
$TERMINAL_FULLSCREEN = kitty --single-instance --start-as=fullscreen --title fullscreen_kitty  # ##  kitty 全屏
$TERMINAL_FLOAT      = kitty --single-instance --title float_kitty # 浮动窗口
$TERMINAL_TILE       = kitty --single-instance --title tile_kitty  # 平铺窗口

# 输入法
# =======================================================================================================================
$IME = fcitx5 -d --replace

# 文件管理器
# =======================================================================================================================
$FILE_MANAGER = thunar

# =======================================================================================================================
$APP_LAUNCHER = $HOME/.config/rofi/scripts/launcher_t2  # ## rofi launcher and theme(themes: https://github.com/adi1090x/rofi)

# Bar 相关
# =======================================================================================================================
$WAYBAR_CONF_DIR  = $HYPR_CONF_DIR/misc/component/waybar
$BAR = waybar -c $WAYBAR_CONF_DIR/config.jsonc -s $WAYBAR_CONF_DIR/style.css
# caelestia shell
# ags
# $EWW_CONF_DIR = $HOME/.config/eww
#$EWW_SCRIPTS_DIR = $EWW_CONF_DIR/scripts
# eww -c $EWW_CONF_DIR daemon && eww -c $EWW_CONF_DIR open bar && eww -c $EWW_CONF_DIR open bgdecor

# 剪切板历史
# =======================================================================================================================
$PRIMARY_CLIPBOARD_VIEWER = cliphist list | rofi -dmenu -theme "$HOME/.config/rofi/launchers/type-2/style-1" | cliphist decode | wl-copy

# 音频
# =======================================================================================================================
$VOLUME_CTL = kitty --single-instance --title kitty_alsamixer  --hold alsamixer   # 待替换成更美观的OSD脚本(待处理)



# Keybind 使用的变量
# =======================================================================================================================


# 壁纸
$WALLPAPER_DAEMON = swww-daemon
$WALLPAPER_DIR    = $HOME/Pictures/Wallpapers                         # 壁纸目录 [ 重要：swww 正常工作必要目录 ]
$WALLPAPER_SWITCH_SCRIPT = $HYPR_SCRIPTS_DIR/swww_randomize.sh        # 壁纸脚本切换路径
$MANUAL_SWITCH_WALLPAPER = $WALLPAPER_SWITCH_SCRIPT -m $WALLPAPER_DIR # 手动切换壁纸 [keybind]
#$AOTU_SWITCH_WALLPAPER   = $WALLPAPER_SWITCH_SCRIPT -d $WALLPAPER_DIR # 取消注释 下次即可开机自动切换壁纸 [keybind]

$LOCAL_BIN_DIR    = $HOME/.local/bin                        # ## 用户 local bin

# Waybar
$WAYBAR_CONF_DIR = $HYPR_CONF_DIR/misc/component/waybar


# LOCK
$SCREEN_LOCK  = hyprlock


# 声音, 亮度, mpris (待处理)

$VOLUME_MUTE = ags -r "audio.speaker.isMuted = !audio.speaker.isMuted"    || $HYPR_SCRIPTS_DIR/volume_brightness.sh volume_mute || pactl set-sink-mute @DEFAULT_SINK@ toggle
$VOLUME_UP   = ags -r 'audio.speaker.volume += 0.1; indicator.speaker()' || $HYPR_SCRIPTS_DIR/volume_brightness.sh volume_up   || wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
$VOLUME_DOWN = ags -r 'audio.speaker.volume -= 0.1; indicator.speaker()' || $HYPR_SCRIPTS_DIR/volume_brightness.sh volume_down || wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-

$BRIGHTNESS_UP   = ags -r 'brightness.screen += 0.5; indicator.display()' || $HYPR_SCRIPTS_DIR/volume_brightness.sh brightness_up   || light -A 2
$BRIGHTNESS_DOWN = ags -r 'brightness.screen -= 0.5; indicator.display()' || $HYPR_SCRIPTS_DIR/volume_brightness.sh brightness_down || light -U 2

$NEXT_TRACK = ags -r 'mpris.next()'      || $HYPR_SCRIPTS_DIR/volume_brightness.sh next_track
$PLAY_PAUSE = ags -r 'mpris.playPause()' || $HYPR_SCRIPTS_DIR/volume_brightness.sh play_pause
$PREV_TRACK = ags -r 'mpris.previous()'  || $HYPR_SCRIPTS_DIR/volume_brightness.sh prev_track

$VOLUME_OSD = $EWW_SCRIPTS_DIR/volume osd &
$BRIGHTNESS_OSD = $EWW_SCRIPTS_DIR/brightness osd &
# =======================================================================================================================
