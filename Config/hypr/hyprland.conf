# ## ==========================# Source #=============================
# Hyprland 配置为线性加载顺序

#source =# 确保变量正确初始化
source = ~/.config/hypr/configs/env.conf                # 环境变量
source = ~/.config/hypr/configs/init.conf               # 初始化
source = ~/.config/hypr/configs/exec_once.conf          # 自启动程序
source = ~/.config/hypr/configs/window_animations.conf  # 窗口动效
source = ~/.config/hypr/configs/window_rules.conf       # 窗口规则
source = ~/.config/hypr/configs/keybinds.conf           # 快捷键
source = ~/.config/hypr/color_themes/current.conf       # 颜色主题
#source = ~/.config/hypr/configs/group_windows.conf      # 所有与组相关的配置

# ===================================================================
#                            Monitors (双屏)
# # 1.Add a (, cm, X) to change default sRGB output preset
# auto: 自动，对于8bpc使用sRGB，如果支持则使用wide
# srgb: sRGB原色(default)
# wide: 广色域 BT2020原色
# edid: edid 原色
# hdr: 广色域和 HDR PQ
# hdredid: hdr 使用 edid 原色
#
# # 2.手动设置 mode模式
# monitor = DP-1, modeline 1071.101 3840 3848 3880 3920 2160 2263 2271 2277 +hsync -vsync, 0x0, 1
#
# # 3.resolutions opt
# preferred：首选尺寸和刷新率
# highres：支持的最高分辨率
# maxwidth：支持的最宽分辨率
#
# # 4.position opt
# auto：默认会把新显示器放于右侧，使用显示器左上角作为原点
# auto-right/left/up/down
# auto-center-right/left/up/down
#
# # 5.镜像显示 mirror (,mirror, <MONIROR-NAME>)
# # 6.sdrbrightness, B 和 sdrsaturation, S 控制 HDR 模式下的 SDR 亮度和饱和度，默认为 1.0 (Typical: 1.0 - 2.0)
# # 7.vrr 可变刷新率 （,vrr, x) x来自 misc:vrr
# ===================================================================
monitorv2 { # monitor 拓展屏
# monitor = HDMI-A-1, 3840x2160@59.997002, 1920x0, 2, transform, 0 #,  bitdepth, 10 # bitdepth, 10
    output = HDMI-A-1
    mode = 3840x2160@59.997002
    position = 1920x0
    scale = 2
    transform = 0
    cm = hdr
    bitdepth = 10
    sdrbrightness = 1.0
    sdrsaturation = 1.0
  }

monitorv2 { # 笔记本内屏
# monitor = DSI-1,    1200x1920@60.000000, 0x0,    1, transform, 3, , cm, hddr, bitdepth, 10
    output = DSI-1
    mode = 1200x1920@60.000000
    position = 0x0
    scale = 1
    transform = 3
    cm = hdr
    bitdepth = 10
    sdrbrightness = 1.0
    sdrsaturation = 1.0
  }
monitor =      ,    preferred,           auto,   1                                # 用于快速识别其他便携显示器
monitor = DSI-1,    addreserved,         0,10,10,10                               # 添加屏幕保留区域(不被平铺窗口占用)

# ===================================================================
#                            工作区绑定
# 将工作区绑定到确定的屏幕可以避免一些与工作区相关的未知问题
# ===================================================================
workspace = 1,  monitor:DSI-1,    default:true
workspace = 2,  monitor:DSI-1,    default:true
workspace = 3,  monitor:HDMI-A-1, default:true
workspace = 4,  monitor:HDMI-A-1, default:true

# ===================================================================
#                            Plugin manager
# ===================================================================
permission = /usr/(bin|local/bin)/hyprpm, plugin, allow

# ===================================================================
#                            常规设置
# ===================================================================
general {
# ## 布局
    layout                  = dwindle     # master,dwindle(default)

# ## 鼠标
    #sensitivity             = 1.0        # 鼠标灵敏度  (推荐优先使用 input:sensitivity，将灵敏度绑定到指定设备避免未知错误)
    #cursor_inactive_timeout = 3          # 非活动状态隐藏鼠标(秒)
    #no_cursor_warps         = false      # 如果为 true，则在许多情况下不会扭曲光标（聚焦、键绑定等)
    #apply_sens_to_raw       = false      # 如果启用，还将对原始鼠标输出应用灵敏度（例如游戏中的灵敏度） 注意：真的不推荐。

# ## 窗口
    gaps_in                 = 8            # 窗口之间的间隙
    gaps_out                = 15           # 窗口与屏幕边缘之间的间隙
    #float_gaps              = -1          # 浮动窗口和显示器边缘之间的间隙，也支持 css 样式间隙（顶部、右侧、底部、左侧 -> 5 10 15 20）。-1 默认
    gaps_workspaces         = 0            # 工作区之间的间距，并与gaps_out 堆叠
    border_size             = 8            # 窗口边框大小
# 边框颜色
    col.active_border       = rgb(c77eb5)  # 活动窗口边框颜色
    col.active_border       = rgb(c77eb5) rgb(d93a49) rgb(ed1941) 45deg # rgba(9778D0FF) 45deg
    col.inactive_border     = rgb(45475a)  # 非活动窗口边框颜色
    no_border_on_floating   = false        # 浮动窗口边框
    no_focus_fallback       = false        # 如果为 true，则在将焦点移动到没有窗口的方向时失去窗口焦点，不回退到下一个可选窗口

# ## 其他
    resize_on_border        = true       # 允许拖动边框和间隙调整窗口大小
    extend_border_grab_area = 15         # 拓展边框周围区域，允许在其中单击并拖动 前置设置：general:resize_on_border
    hover_icon_on_border    = true       # 鼠标悬停边框周围时显示拖动图标         前置设置：general:extend_border_grab_area
    allow_tearing           = false      # 是否允许发送画面撕裂的主开关 (intel 不支持) [v0.30.0]
    resize_corner           = 0          # 强制浮动窗口在调整大小时使用特定的角（1-4 从左上角顺时针旋转，0禁用）

    snap { # general:snap
      enabled         = true             # 启动浮动窗口的捕捉
      window_gap      = 10               # 捕捉窗口之间最小像素间隙
      monitor_gap     = 10               # 捕捉之前窗口和显示器边缘之间的最小像素间隙
      border_overlap  = true             # 如果为 true ，窗口之间像素距离在小于捕捉间隙时对齐并合并邻近边框为一个
      #respect_gaps    = false            # 捕捉将考虑窗口之间的间隙 (general:gaps_in相关)
      }
}

# ===================================================================
#                           杂项设置
# ===================================================================
# ___________________________________________________________________
misc {
  disable_hyprland_logo         = false  # 禁用随机海普兰徽标/动漫女孩背景
  disable_splash_rendering      = false  # 禁用 Hyprland splash 渲染
  col.splash                    = 0xffffffff # 更改启动文本的颜色
  font_family                   = HYLeMiaoTiJ # 全局默认字体
  splash_font_family           = [[Empty]]  # 更改用于渲染启动文本的字体，从系统字体中选择（需要重新加载监视器才能生效
  force_default_wallpaper       = -1     # 强制执行 3 张默认壁纸中的任何一张。 0: 禁用动漫背景。 -1: “随机”
  vfr                           = true   # 控制 hyprland 的 VFR 状态。强烈建议保留 true 以节省资源 (default:true)
  vrr                           = 0      # 控制显示器的 VRR 自适应同步，0 - 关闭，1 - 打开, 2 - 仅全屏 (default:0)
  mouse_move_enables_dpms       = false  # 关闭禁用鼠标移动唤醒可以一同禁用触控唤醒
  key_press_enables_dpms        = true   # 在dmps设置为关闭时，只能通过键盘来唤醒屏幕
  always_follow_on_dnd          = true   # 拖放时鼠标焦点跟随鼠标 (default:true)
  layers_hog_keyboard_focus     = true   # 使键盘交互层将焦点集中在鼠标移动上
  animate_manual_resizes        = true   # 手动更改窗口大小时进行动画处理 (default:false)
  animate_mouse_windowdragging  = false  # 对鼠标拖动移动的窗口进行动画处理,可能会有奇怪画面bug(default:false)
  disable_autoreload            = false  # 关闭 Hyprland 配置自动重载，可以使用 hyprctl reload 手动重载，可能会节省电池
  enable_swallow                = false  # 窗口吞噬
  #swallow_regex                 =        # 用于应吞噬的窗口 (通常是终端) 的类正则表达式 (str, https://github.com/ziishaned/learn-regex/blob/master/README.md )
  #swallow_exception_regex       =        # 标题正则，用于不应该被 swallow_regex 中指定的窗口吞噬的窗口 (e.g. wev)
  focus_on_activate             = false  # Hyprland 是否关注请求聚焦的应用
  allow_session_lock_restore    = true   # 允许您重新启动锁屏应用程序，以防它崩溃红屏死机
  mouse_move_focuses_monitor    = true   # 窗口焦点移动到其他显示器时是否聚焦
  close_special_on_empty        = true   # 如果删除最后一个窗口，关闭特殊工作区 (0.29.1)
  #background_color              = 0x111111 # 启用背景颜色 (前置启用 disable_hyprland_logo/ v0.29.0)
  #ssuppress_portal_warnings      = false   # 禁用有关不兼容 portal 实现的警告 [wiki 中有相关选项，但是实际并不支持？]

# ## Cursor
  #cursor_zoom_factor            = 1.0    # 光标围绕缩放，放大镜 (Minimum:1.0 无缩放)
  #cursor_zoom_rigid             = false  # 光标周围的缩放应该严格跟随光标(如果可以，光标始终居中)还是松散 (default:false)


# ## 触控屏幕
  #hide_cursor_on_touch          = true  # 当最后一个输入是触摸时隐藏光标，直到输入完毕

  new_window_takes_over_fullscreen = 2  # ## 如果存在全屏窗口，则打开的新平铺窗口应替换全屏窗口还是保留。0 - 后面，1 - 接管，2 - 取消全屏当前全屏窗口 [v 0.31.0 add]
  exit_window_retains_fullscreen = false # 关闭全屏窗口会使下一个聚焦的窗口切换为全屏状态
  initial_workspace_tracking = 0        # 窗口将在调用他们的工作区上打开，0禁用，1单次，2持久
  middle_click_paste = true             # 鼠标中键单击粘贴(也称为主要选择)
  render_unfocused_fps = 15             # renderundocused 窗口在后台的fps最大限制
  disable_xdg_env_checks =false         #如果XDG环境是外部管理的，则禁用警告
  disable_hyprland_qtutils_check =false # 如果未安装 hyprland_qutils 则禁用警告
  lockdead_screen_delay = 1000           # 如果发生锁屏事件未出现锁屏，则出现锁定屏幕后的延迟？？ (ms)
  #enable_anr_dialog = true             # 当应用挂起时，是否启动 ANR （应用不响应对话框）
  #anr_missed_pings  = 1                # 显示 ANR 对话框之前错过的 ping 次数
}



# ===================================================================
#                           装饰设置
# ===================================================================
# ___________________________________________________________________
decoration {

# ## 圆角
  rounding               = 18            # 半径 （px)
  rounding_power         = 2.0           # 调整圆角曲线 ( 2.0 - 10.0 )

# ## 透明度
  active_opacity         = 0.8           # 活动 (0.0 - 1.0)
  inactive_opacity       = 0.8           # 非活动
  fullscreen_opacity     = 0.8           # 全屏窗口

 # dim
  dim_inactive           = false         # 非活动窗口变暗 (效果在窗口非透明情况下不错)
  dim_strength           = 0.5           # 非活动窗口变暗数值(0.0 - 1.0)
  dim_special            = 0.2           # 打开特殊工作区时，屏幕其余部分暗度(0.0 - 1.0)
  dim_around             = 0.4           # 添加了 dimaround 窗口规则情况下窗口的暗度(0.0 - 1.0)
  #screen_shader          =              # 在渲染结束时应用的自定义着色器的路径 ( 参考: https://github.com/hyprwm/Hyprland/tree/main/example/screenShader.frag )
  border_part_of_window  = true          # 窗口边框是否应成为窗口的一部分

  blur {  # decoration:blur
    enabled           = true    # [ NEW BUG ]
    size              = 4       # 最少为 1
    passes            = 2       # 最少为 1，高 passes 对 GPU 施加更大压力
    ignore_opacity    = true    # 使模糊图层忽略窗口的不透明度
    new_optimizations = true    # 是否对模糊启用优化，提高性能
    xray              = true    # 浮动窗口透明桌面
    noise             = 0       # 噪声 (0.0 - 1.0)
    contrast          = 1.4     # 对比度 (0.0 -2.0)
    brightness        = 0.8     # 亮度 (0.0 - 2.0)
    vibrancy          = 0.5     # 模糊颜色的饱和度
    vibrancy_darkness = 0.5     # 对变暗区域的 vibrancy 影响
    special           = false   # 作用于特殊工作区 (性能损耗大)
    popups            = true    # 是否模糊弹出窗口 （右键菜单）
    popups_ignorealpha= 0.2     # 如果像素不透明度地域设定值，则不会模糊 [0.0 - 1.0]
    input_methods     = false   # 是否模糊输入法
    input_methods_ignorealpha = 0.2 # 与图层规则中的 ignorealpha 类似，如果像素不透明度低于设定，则不模糊 [0.0-1.0]
  }

  shadow {  # decoration:shadow
  # ## 阴影
  enabled        = false         # 启用阴影
  range          = 4              # 布局 px 中的阴影范围
  render_power   = 3             # 衰减功率 (1 - 4, 越大衰减越快)
  sharp          = false         # 使阴影锐化
  ignore_window  = true          # 是否渲染在窗口本身后面，否则仅渲染窗口周围
  color          = 0x66404040    # 活动窗口阴影颜色
  color_inactive = 0x66404040    # 非活动窗口阴影颜色 (unset 则与 col.shadow 相同)
  offset         = 1 2           # 偏移 [0,0]
  scale          = 1.0           # 阴影缩放比例 (0.0 - 1.0)
  }

}


# ===================================================================
#                           输入设备
# ===================================================================
# ___________________________________________________________________
input {   # ## (https://wiki.hyprland.org/Configuring/Variables/#input)
# ## XKB 键盘映射
    #kb_model  =
    kb_layout = us
    #kb_variant=
    #kb_options=
    #kb_rules  =
    #kb_file =                        # 自定义 XKB 文件路径

# ## keyboard
    numlock_by_default = false        # 默认锁定小键盘
    resolve_binds_by_sym = false      # 使用多个键盘布局时案件绑定的行为模式，false 默认为第一个指定布局，否则当使用相应布局则激活对应布局指定的符号指定的按键绑定
    #repeat_rate = 25                 # 按住键的重复速率 (秒/次数)
    #repeat_delay = 600               # 重复按住键之前的延迟 (ms)

# ## mouse
    sensitivity     = 1.0             # 鼠标灵敏度 (-1.0 - 1.0) (https://wayland.freedesktop.org/libinput/doc/latest/pointer-acceleration.html#pointer-acceleration)
    accel_profile =  custom           # 设置光标加速配置文件。可以是adaptive、flat 之一  。也可以， custom 见下文。留空以对输入设备使用 libinput 的默认模式。
    force_no_accel  = false           # 强制不启用光标加速。这将绕过大多数指针设置，以获得尽可能原始的信号。不建议启用此功能，因为可能会出现游标不同步。
    left_handed     = false           # 左手模式
    # scroll_points: custom 设置滚动加速配置文件，<step> <point> 形式，留空则使用平滑的滚动曲线 [模拟windows: https://gist.github.com/fufexan/de2099bc3086f3a6c83d61fc1fcc06c9]
    scroll_points = 0.2144477506  0.000 0.051 0.102 0.179 0.257 0.334 0.418 0.535 0.652 0.769 0.886 1.003 1.120 1.237 1.354 1.471 1.588 1.705 1.823 2.064
    # scroll_method =                 # 设置滚动方法。可以是 2fg （2 根手指）、 edge 、 on_button_down 、 no_scroll 之一。库输入#滚动
    # scroll_button = 0               # 滚动按钮 (int) 0 是默认值
    # natural_scroll = false          # 反转滚动方向，滚动会直接移动内筒而不是操控滚动条
    # scroll_button_lock = false      # 滚动按钮锁定，则无需按住滚动按钮，再次按下则切换按钮锁定状态
    # scroll_factor = 1.0             # 为外部鼠标滚动添加乘数（触摸板有一个单独的的scroll_factor 设置)
    follow_mouse   = 1                # （0/1/2/3） 指定光标移动是否以及如何影响窗口焦点
    #follow_mouse_threshold = 0       # 跟随阈值，鼠标需要移动的最小距离会使鼠标下方的窗口获得焦点
    #focus_on_close = 0               # 控制窗口关闭时的窗口焦点行为，0：焦点将转移到下一个候选窗口，1：转移的光标下方窗口
    mouse_refocus  = true             # 禁用则鼠标焦点将不会切换到悬浮窗口，在悬浮窗口与普通窗口重叠时, 除非在 follow_mouse=1 时鼠标越过普通窗口边界
    float_switch_override_focus = 2   # 如果启用（1 或 2），则从平铺更改为浮动时，焦点将更改为光标下方的窗口，反之亦然。如果为 2，焦点也将跟随鼠标在浮子到浮子开关上
    special_fallthrough = false       # 如果启动，则特殊工作区中只有浮动窗口的情况下将不会挡住常规工作区中的聚焦窗口
    off_window_axis_events = 1        # 处理聚焦窗口周围的轴事件（平铺间隙/边框，浮动的拖动区域/边框），0 忽略，1发送界坐标，2 伪造指针坐标到窗口内最近的点，3 扭曲窗口光标移动到窗口内最近的点
    emulate_discrete_scroll=1         # 模拟高分辨率滚动事件的离散滚动，0禁用，1仅允许处理非标准事件，2强制允许处理所有滚轮事件

    touchpad { # input:touchpad
        disable_while_typing = true   # 输入时禁用触摸板
        natural_scroll       = true   # 反向滚动
        scroll_factor        = 1.0    # 滚动距离的乘数
        middle_button_emulation = false   # 同时发送 LMB 和 RMB 将被识别为鼠标中间点击，这将禁用任何通常会根据位置发送中键单击的触摸板区域。( https://wayland.freedesktop.org/libinput/doc/latest/middle-button-emulation.html )
        # tap_button_map        =         # 设置触摸板按钮模拟的点击映射，lrm (default) 或者 lmr (left,middle,right buttons)
        # clickfinger_behavior  = false   # 分别用 1 2 3 根手指按下映射为 LMB,RMB,MMB。这将会禁用触摸板的单击解释 (https://wayland.freedesktop.org/libinput/doc/latest/clickpad-softbuttons.html#clickfinger-behavior)
        # tap-to-click          = true    # 分别用 1 2 3 根手指按下映射为 LMB,RMB,MMB
        drag_lock               = false   # 拖动时将手指抬起一小段时间不会放下拖动项目
        # tap-and-drag          = false   # 触摸板的点击和拖动模式
        # flip_x                = false   # 反转触摸板的水平移动
        # flip_y                = false   # 反转触摸板的垂直移动
        # drag_3fg              = 0       # 三指拖动 0:禁用，1->3个手指，2->4个手指
    }

    touchdevice {  # input:touchdevice [v0.30.0]
        transform = 3
        #output = [auto]    # 显示器绑定触摸设备，默认为自动，空字符串/[[Empty]]停止自动检测
        #enabled = true     # 是否为触摸设备启动输入
      }
    tablet {  # input:tablet [v0.30.0]
        transform = 3
        output = DSI-1         # 显示器绑定 tablet, 空字符串为不绑定
        #region_position = [0,0]    # 监视器布局中映射区域的位置
        #region_size     = [0,0]    # 映射区域的大小，tablet 输入将映射到该区域，[0,0]/无效的大小表示未设置
        #obsolute_region_position = false # 是否将 region_position 视为监视器布局中的绝对位置，仅当putput为空适用
        #relative_input = false     # 相对输入
        #left_handed = flase        # 如果启用，tablet 将旋转 180度
        #active_area_size = [0,0]   # tablet 活动区域大小 (毫米)
        #active_area_position = [0,0] # 活动区域位置 (毫米)
      }
}

#                           触摸板手势
# ___________________________________________________________________
gestures {
    workspace_swipe                     = false   # 启用工作区滑动手势
    workspace_swipe_fingers             = 2       # 滑动工作区需要手指的数量
    workspace_swipe_min_fingers         = false   # 如果启用，workspace_swipe_fingers 被认为是要滑动的最小手指的数量
    workspace_swipe_distance            = 300     # 手势距离 (px)
    workspace_swipe_touch               = false   # 启用工作区从touchscreen边缘滑动
    workspace_swipe_invert              = true    # 工作区滑动反转方向
    workspace_swipe_min_speed_to_force  = 0       # 每个时间点以 px 为单位的最小速度，以强制忽略 cancel_ratio 更改。设置为 将 0 禁用此机制。
    workspace_swipe_cancel_ratio        = 0.5     # 手势触发距离 (0.0 - 1.0) 滑动距离 > 0.5 * 手势距离 = 触发手势
    workspace_swipe_create_new          = true    # 在最后一个工作区向右滑动是否创建新工作区
    workspace_swipe_direction_lock      = true    # 如果启用，当滑过 direction_lock_threshold 切换方向将被锁定
    workspace_swipe_direction_lock_threshold = 10 # 方向锁定触发的距离 (px) ?
    workspace_swipe_forever             = false   # 滑动不会回退到相邻工作区，而是到下一个工作区 ?
    workspace_swipe_use_r               = false   # ## 如果启用，轻扫将使用前缀 r 而不是 m 前缀来查找工作区。（需要禁用 workspace_swipe_numbered)
}

#                           layouts setting
# ___________________________________________________________________
dwindle {
    pseudotile           = true      # enable pseudotiling on dwindle
    force_split          = 2
    preserve_split       = true
    special_scale_factor = 0.8       # (0.0 - 1.0) 指定特殊工作区上窗口的缩放
    #no_gaps_when_only    = 0         # 当工作区只有一个窗口时是否也有间隙 (0-disable, 1- 无边框，2-带边框)
}

master {
  #mfact = 0.5
  #orientation = left
}

#                           keybinds setting
# ___________________________________________________________________
binds {
  pass_mouse_when_bound    = false  # 如果禁用，则不会将鼠标事件传递给应用 在触发键绑定时拖动窗口
  scroll_event_delay       = 300    # 以 ms 为单位，在滚动事件后等待多少毫秒，才允许传递建绑定 (ms)
  workspace_back_and_forth = false  # 如果启用，尝试切换到当前焦点工作区将更改为切换到上一个工作区，类似 i3 的 auto_back_and_forth
  #hide_special_on_workspace_change = false # 如果启用，更改活动工作区（包括其自身）将隐藏新活动工作区所在的显示器上的特殊工作区。	bool 
  allow_workspace_cycles   = false  # 如果启用，工作区不会忘记以前的工作区，因此可以通过按顺序切换到第一个工作区来创建周期
  workspace_center_on      = 0      # 切换工作区是应将光标居中放在工作区 （0） 上还是该工作区的最后一个活动窗口 （1）
  focus_preferred_method   = 0      # 设置使用 movewindow / focuswindow 方向时首选的焦点查找方法，0 - 历史记录（最近优先）， 1 - 长度 （较长的共享边具有优先级）
  movefocus_cycles_fullscreen = false # 启用时在全屏窗口时 movefocus 将循环全屏，未启用将向一个方向移动焦点
  disable_keybind_grabbing = false # 如果启用，请求禁用键绑定的应用程序（例如虚拟机）将无法执行此操作。
  window_direction_monitor_fallback = true # 如果启用，则按某个方向将窗口或焦点移动到监视器边缘上方会将其移动到该方向上的下一个监视器
  allow_pin_fullscreen = false # 如果启用，允许全屏固定窗口，然后恢复其固定状态
  drag_threshold = 0 # 窗口拖动和 c/g 绑定标志的移动阈值（以像素为单位）。0 表示禁用并在鼠标按下时抓取。
}

#                           xwayland setting
# ___________________________________________________________________
xwayland {
  enabled = true
  use_nearest_neighbor = true   # 对 xwayland 应用使用最近的 neigbor 过滤，使它们像素化而不是模糊 (default:true)
  force_zero_scaling   = true   # 强制缩放显示器上的 xwayland 窗口比例为 1 (default:false)
  create_abstract_socket = false # 为 XWayland 连接创建抽象的 Unix 域套接字 。（需要重启 XWayland 才能使更改生效；仅限 Linux）
}



# openGL { 
# nvidia_anti_flicker = true #减少 nvidia 上的闪烁，低端 GPU 会出现帧丢失
#   }

cursor {
    no_hardware_cursors = false # 禁用硬件光标
    no_break_fs_vrr = false     # 禁用在启用 VRR 的全屏应用的光标移动时安排新帧，以避免帧速率峰值(需要 no_hardware_cursors = true)
    min_refresh_rate = 24       # no_break_fs_vrr = true 时光标移动的最小刷新率，设置为支持的最低刷新率或者更高
    hotspot_padding = 1         # 屏幕边缘和光标之间的填充 (px)
    inactive_timeout = 3        # 光标不活动多少秒后隐藏, 0 表示从不
    no_warps = false            # 如果为 true ，则在许多情况下不会扭曲光标 (聚焦，按键绑定)
    persistent_warps = false    # 当窗口重新聚焦时，光标返回到相对于该窗口的最后位置，而不是中心
    warp_on_change_workspace = false # 如果为 true ，则在更改工作区后将光标移动到最后一个焦点窗口
    #default_monitor = [[Empty]] # 启动时要设置的光标的默认监视器的名称，(相关名称，参阅 hyprctl monitors)
    zoom_factor = 1.0           # 光标周围缩放的系数，最小 1.0 (表示无缩放)
    zoom_rigid = false          # 缩放是否应该严格跟随光标 (如果可以，光标始终居中)还是松散的跟随
    enable_hyprcursor = true    # 启动hyprcursor支持
    hide_on_key_press = false   # 当按下任意键时隐藏光标，直到鼠标移动
    hide_on_touch = true        # 当最后一个输入是触摸输入时隐藏光标，直到鼠标输入完成
    #allow_dumb_copy = false     # 使硬件光标在 nvidia 上工作，(每当图像发生变化时可能出现故障)
    sync_gsettings_theme = true # 将 xcursor 主题与 gsettings 同步，它将主题加载上的光标主题和光标大小应用于 gsettings，使得大多数基于 CSD gtk 的客户端使用相同的 xcursor 主题和大小。
    use_cpu_buffer = 2 # 使硬件游标使用 CPU 缓冲区。Nvidia 系统必须启用硬件游标。0 - 关闭，1 - 开启，2 - 自动（仅限 Nvidia）
    warp_back_after_non_mouse_input = false # 使用非鼠标输入移动光标后，将光标返回到原来的位置，然后返回到鼠标。
  }

render {
  expand_undersized_textures = true # 是否沿边缘扩展尺寸过小的纹理，或者拉伸整个纹理。
  xp_mode = false       # 禁用后台缓冲区和底层渲染
  ctm_animation = 2     # CTM 变化 (hyprsunset)  启用淡入淡出动画 2:auto 在nvidia禁用
  cm_fs_passthrough = 2 # 尽可能为全屏应用设置直通颜色 0:关闭，1：始终 2：仅限hdr
  send_content_type = true # 报告内容类型允许监视器配置文件自动切换，切换期间可能黑屏
  #cm_auto_hdr = 1       # 需要时自动切换到全屏 HDR, 0:关闭，1：切换到cm,hdr, 2：切换到cm,hdredid
  #explicit_sync_kms = 2 # 是否启用 KMS 层的显式同步支持。需要启用explicit_sync。 0 - 否，1 - 是，2 - 基于 GPU 驱动程序的自动
  #direct_scanout = 0 # 启用直接扫描输出。当屏幕上只有一个全屏应用程序（例如游戏）时，直接扫描输出会尝试减少延迟。如果全屏应用程序出现图形故障，建议将此设置为 false。0 - 关闭，1 - 开启，2 - 自动（内容类型为“游戏”时开启）
  }

ecosystem {
  no_update_news = true # 禁用将 hyprland 更新到新版本时显示的弹出窗口。
  no_donation_nag = false # 禁用每年两次出现鼓励捐赠的弹出窗口。
  enforce_permissions = false # 是否启用权限控制 。
  }

experimental {
    xx_color_management_v4  = false # 启用色彩管理协议
  }

debug {
  overlay = false # 打印调试性能覆盖图。禁用 VFR 以获得准确结果
  damage_blink = false # （癫痫警告！）闪光区域更新了损坏跟踪
  disable_logs = true # 禁用记录到文件
  disable_time = true # 禁用时间记录
  damage_tracking = 2 # 仅重绘显示中所需的部分。不要改变。 （默认值：完整 - 2）监视器 - 1，无 - 0
  enable_stdout_logs = false # 启用记录到标准输出
  manual_crash = 0 # 设置为 1，然后返回 0 会导致 Hyprland 崩溃。
  suppress_errors = false # 如果为 true，则不显示配置文件解析错误。
  #watchdog_timeout = 5 # 设置看门狗中止处理主线程信号的超时时间（以秒为单位）。设置为 0 以禁用。
  disable_scale_checks = false # 禁用比例因子的验证。将导致像素对齐和舍入错误
  error_limit = 5 # 限制显示的配置文件解析错误的数量。
  error_position = 0 # 设置误差线的位置。顶部 - 0，底部 - 1
  colored_stdout_logs = true # 在标准输出日志中启用颜色
  pass = false # 启用渲染过程调试。
  full_cm_proto = false # 声称支持所有 cm proto 功能（需要重启）
  }
